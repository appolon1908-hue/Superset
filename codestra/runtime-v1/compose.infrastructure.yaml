name: codestra-superset-infrastructure

services:
  superset-postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD_FILE: /run/secrets/superset_postgres_password
    secrets:
      - superset_postgres_password
    volumes:
      - superset_postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /run/postgresql:rw,nosuid,nodev,size=16m
    networks:
      codestra-analytics:
        aliases:
          - superset-postgres
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U superset -d superset
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
          pids: 256
        reservations:
          cpus: "0.20"
          memory: 512M

  superset-redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    restart: unless-stopped
    command:
      - redis-server
      - --aclfile
      - /run/secrets/superset_redis_acl
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1"
      - --dir
      - /data
    secrets:
      - superset_redis_acl
    volumes:
      - superset_redis_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks:
      codestra-analytics:
        aliases:
          - superset-redis
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(sed -n 's/^user default on >\([^ ]*\).*/\1/p' /run/secrets/superset_redis_acl)"
          redis-cli ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 128M

networks:
  codestra-analytics:
    external: true
    name: ${CODESTRA_ANALYTICS_NETWORK:-codestra-analytics}

volumes:
  superset_postgres_data:
  superset_redis_data:

secrets:
  superset_postgres_password:
    file: ${SUPERSET_POSTGRES_PASSWORD_FILE_SOURCE:?Superset PostgreSQL password file is required}
  superset_redis_acl:
    file: ${SUPERSET_REDIS_ACL_FILE_SOURCE:?Superset Redis ACL file is required}
