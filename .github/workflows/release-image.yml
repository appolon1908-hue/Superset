name: Release and activate signed Superset image

on:
  push:
    branches:
      - production
    paths:
      - .github/workflows/release-image.yml
      - codestra/release/**
      - codestra/runtime-v1/**
      - scripts/production_runtime_preflight.sh
      - scripts/deploy_production.sh
      - scripts/verify_release_identity.sh
      - requirements-runtime.in
      - requirements-runtime.txt
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable label codestra-superset-vX.Y.Z
        required: true
        type: string
      protected_source_sha:
        description: Exact current production-branch commit
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: superset-production-activation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Check out exact production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.protected_source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind immutable release identity
        id: identity
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          DISPATCH_SHA: ${{ inputs.protected_source_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/production
          git fetch --no-tags origin production
          production_sha="$(git rev-parse origin/production)"
          test "$(git rev-parse HEAD)" = "$production_sha"

          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            source_sha="$DISPATCH_SHA"
            release_tag="$DISPATCH_TAG"
          else
            source_sha="$GITHUB_SHA"
            release_tag="codestra-superset-v2026.9.${GITHUB_RUN_NUMBER}"
          fi

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_tag" =~ ^codestra-superset-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$source_sha" = "$production_sha"
          test "$source_sha" = "$(git rev-parse HEAD)"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  runtime-preflight:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST || vars.PRODUCTION_HOST || '37.27.128.39' }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER || vars.PRODUCTION_USER || 'root' }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      PRODUCTION_RUNTIME_ROOT: ${{ vars.PRODUCTION_RUNTIME_ROOT || '/srv/codestra/superset' }}
      PRODUCTION_SECRET_ROOT: ${{ vars.PRODUCTION_SECRET_ROOT || '/etc/codestra/secrets/superset' }}
      SUPERSET_LOOPBACK_PORT: ${{ vars.SUPERSET_LOOPBACK_PORT || '18088' }}
    steps:
      - name: Check out exact production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Validate deployment identity and pinned SSH trust
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"
          for value in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS; do
            test -n "${!value:-}" || { echo "ERROR=MISSING_${value}" >&2; exit 1; }
          done
          [[ "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$PRODUCTION_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Run read-only production preflight
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=12
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            bash -s -- \
            "$PRODUCTION_RUNTIME_ROOT" \
            "$PRODUCTION_SECRET_ROOT" \
            "$PRODUCTION_HOST" \
            "$SUPERSET_LOOPBACK_PORT" \
            < scripts/production_runtime_preflight.sh | tee production-preflight.txt
          grep -qx 'SUPERSET_PRODUCTION_PREFLIGHT=PASS' production-preflight.txt

      - name: Upload sanitized preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superset-production-preflight-${{ needs.prepare.outputs.source_sha }}
          path: production-preflight.txt
          if-no-files-found: error
          retention-days: 90

  release:
    needs:
      - prepare
      - runtime-preflight
    uses: appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml@9a6aebb849bbc068105c10d9d1dfd39ebf6f78bd
    with:
      image_id: superset
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      protected_source_sha: ${{ needs.prepare.outputs.source_sha }}

  deploy:
    needs:
      - prepare
      - release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      packages: read
      attestations: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST || vars.PRODUCTION_HOST || '37.27.128.39' }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER || vars.PRODUCTION_USER || 'root' }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT || '22' }}
      PRODUCTION_RUNTIME_ROOT: ${{ vars.PRODUCTION_RUNTIME_ROOT || '/srv/codestra/superset' }}
      PRODUCTION_SECRET_ROOT: ${{ vars.PRODUCTION_SECRET_ROOT || '/etc/codestra/secrets/superset' }}
      SUPERSET_LOOPBACK_PORT: ${{ vars.SUPERSET_LOOPBACK_PORT || '18088' }}
      SUPERSET_OIDC_CLIENT_SECRET: ${{ secrets.SUPERSET_OIDC_CLIENT_SECRET }}
    steps:
      - name: Check out exact released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Resolve and verify the immutable signed image
        id: image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          registry='ghcr.io/appolon1908-hue/superset-superset'
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          digest="$(docker buildx imagetools inspect "${registry}:${RELEASE_TAG}" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          identity="${registry}@${digest}"
          docker pull "$identity" >/dev/null
          bash scripts/verify_release_identity.sh "$identity" "$SOURCE_SHA"
          gh attestation verify "oci://${identity}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-repo appolon1908-hue/Codestra-Telemetry \
            --signer-workflow appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml \
            --signer-digest 9a6aebb849bbc068105c10d9d1dfd39ebf6f78bd \
            --source-ref refs/heads/production \
            --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Configure pinned production SSH identity
        run: |
          set -Eeuo pipefail
          for value in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS; do
            test -n "${!value:-}" || { echo "ERROR=MISSING_${value}" >&2; exit 1; }
          done
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload exact deployment package
        id: package
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          package_root="${RUNNER_TEMP}/superset-production-${SOURCE_SHA}"
          mkdir -p "$package_root"
          install -m 0644 codestra/runtime-v1/compose.candidate.yaml \
            "$package_root/compose.candidate.yaml"
          install -m 0644 codestra/runtime-v1/compose.infrastructure.yaml \
            "$package_root/compose.infrastructure.yaml"
          install -m 0755 scripts/deploy_production.sh \
            "$package_root/deploy_production.sh"
          (
            cd "$package_root"
            sha256sum \
              compose.candidate.yaml \
              compose.infrastructure.yaml \
              deploy_production.sh \
              > package.sha256
          )

          archive_name="superset-production-${SOURCE_SHA}.tar.gz"
          archive="${RUNNER_TEMP}/${archive_name}"
          tar -C "$package_root" -czf "$archive" .
          (
            cd "$RUNNER_TEMP"
            sha256sum "$archive_name" > "${archive_name}.sha256"
          )

          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=12
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp_options=(
            -i "$HOME/.ssh/id_ed25519"
            -P "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=12
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote_root="/tmp/codestra-superset-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "umask 077 && mkdir -p '$remote_root'"
          scp "${scp_options[@]}" "$archive" "${archive}.sha256" \
            "$PRODUCTION_USER@$PRODUCTION_HOST:${remote_root}/"
          printf 'remote_root=%s\n' "$remote_root" >> "$GITHUB_OUTPUT"
          printf 'archive_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"

      - name: Deploy, certify, and retain rollback evidence
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          IMAGE_IDENTITY: ${{ steps.image.outputs.identity }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REMOTE_ROOT: ${{ steps.package.outputs.remote_root }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=12
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          wire_one="$(printf '%s' "$GH_TOKEN" | base64 -w0)"
          wire_two="$(printf '%s' "$SUPERSET_OIDC_CLIENT_SECRET" | base64 -w0)"

          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" bash -s -- \
            "$REMOTE_ROOT" "$ARCHIVE_NAME" <<'REMOTE'
          set -Eeuo pipefail
          remote_root="$1"
          archive_name="$2"
          cd "$remote_root"
          sha256sum --check "${archive_name}.sha256"
          install -d -m 0700 package
          tar -xzf "$archive_name" -C package
          cd package
          sha256sum --check package.sha256
          REMOTE

          {
            printf '%s\n' "$wire_one"
            printf '%s\n' "$wire_two"
          } | ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "$REMOTE_ROOT/package/deploy_production.sh" \
            "$PRODUCTION_RUNTIME_ROOT" \
            "$PRODUCTION_SECRET_ROOT" \
            "$SOURCE_SHA" \
            "$IMAGE_IDENTITY" \
            "$IMAGE_DIGEST" \
            "$SUPERSET_LOOPBACK_PORT" \
            "$PRODUCTION_HOST" \
            "$REMOTE_ROOT/package/compose.candidate.yaml" \
            "$REMOTE_ROOT/package/compose.infrastructure.yaml" \
            | tee production-deployment.txt
          unset wire_one wire_two
          grep -qx 'SUPERSET_PRODUCTION_DEPLOYMENT=PASS' production-deployment.txt

          scp_options=(
            -i "$HOME/.ssh/id_ed25519"
            -P "$PRODUCTION_SSH_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=12
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          scp "${scp_options[@]}" \
            "$PRODUCTION_USER@$PRODUCTION_HOST:${PRODUCTION_RUNTIME_ROOT}/releases/${SOURCE_SHA}/deployment-evidence.txt" \
            deployment-evidence.txt
          ssh "${ssh_options[@]}" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "rm -rf -- '$REMOTE_ROOT'"

      - name: Upload production activation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superset-production-activation-${{ needs.prepare.outputs.source_sha }}
          path: |
            production-deployment.txt
            deployment-evidence.txt
          if-no-files-found: error
          retention-days: 365

  external-certification:
    needs:
      - prepare
      - deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify public HTTPS, liveness, OIDC redirect, and protected API behavior
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              https://supe.codestra.media/health >/dev/null; then
              break
            fi
            test "$attempt" -lt 40
            sleep 15
          done

          headers="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
            https://supe.codestra.media/login/keycloak)"
          [[ "$status" =~ ^(302|303)$ ]]
          grep -Eqi '^location: https://auth\.codestra\.co/realms/codestra/' "$headers"

          csrf="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            https://supe.codestra.media/api/v1/security/csrf_token/)"
          [[ "$csrf" =~ ^(200|302|401|403)$ ]]
          swagger="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            https://supe.codestra.media/swagger/v1)"
          test "$swagger" = 404

          cat > external-certification.txt <<EOF
          SUPERSET_EXTERNAL_CERTIFICATION=PASS
          PROTECTED_SOURCE_SHA=${{ needs.prepare.outputs.source_sha }}
          HTTPS=PASS
          WEB_LIVENESS=PASS
          OIDC_REDIRECT=PASS
          CSRF_ROUTE=PASS
          SWAGGER_EXPECTED_DISABLED_404=PASS
          EOF

      - name: Upload external certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superset-external-certification-${{ needs.prepare.outputs.source_sha }}
          path: external-certification.txt
          if-no-files-found: error
          retention-days: 365
