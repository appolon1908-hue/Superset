name: Release signed Superset image

on:
  push:
    branches: [production]
    paths:
      - .github/workflows/release-image.yml
      - .github/workflows/bounded-runtime-certification.yml
      - codestra/release/**
      - codestra/runtime-v1/**
      - scripts/verify_release_identity.sh
      - scripts/run_disposable_integration.sh
      - scripts/run_production_readonly_canary.sh
      - requirements-runtime.in
      - requirements-runtime.txt
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable label codestra-superset-vX.Y.Z
        required: true
        type: string
      protected_source_sha:
        description: Exact current production-branch commit
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: superset-signed-release-${{ github.event_name == 'workflow_dispatch' && inputs.protected_source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Check out exact production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.protected_source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind immutable release identity
        id: identity
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
          DISPATCH_SHA: ${{ inputs.protected_source_sha }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/production
          git fetch --no-tags origin production
          production_sha="$(git rev-parse origin/production)"
          test "$(git rev-parse HEAD)" = "$production_sha"

          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            source_sha="$DISPATCH_SHA"
            release_tag="$DISPATCH_TAG"
          else
            source_sha="$GITHUB_SHA"
            release_tag="codestra-superset-v2026.9.${GITHUB_RUN_NUMBER}"
          fi

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_tag" =~ ^codestra-superset-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$source_sha" = "$production_sha"
          test "$source_sha" = "$(git rev-parse HEAD)"
          printf 'release_tag=%s\nsource_sha=%s\n' "$release_tag" "$source_sha" >> "$GITHUB_OUTPUT"
          echo SUPERSET_RELEASE_SOURCE_AUTHORITY=PASS

  release:
    needs: prepare
    uses: appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml@9a6aebb849bbc068105c10d9d1dfd39ebf6f78bd
    with:
      image_id: superset
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      protected_source_sha: ${{ needs.prepare.outputs.source_sha }}

  verify-release:
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.identity }}
      image_digest: ${{ steps.image.outputs.digest }}
      release_evidence_sha256: ${{ steps.evidence.outputs.sha256 }}
    permissions:
      contents: write
      packages: read
      attestations: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      REGISTRY: ghcr.io/appolon1908-hue/superset-superset
    steps:
      - name: Check out the exact released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve, inspect, and verify the exact signed digest
        id: image
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin production
          test "$(git rev-parse origin/production)" = "$SOURCE_SHA"

          digest=''
          for attempt in $(seq 1 30); do
            digest="$(docker buildx imagetools inspect "${REGISTRY}:${RELEASE_TAG}" 2>/dev/null | awk '$1 == "Digest:" {print $2; exit}' || true)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            digest=''
            test "$attempt" -lt 30 || { echo SUPERSET_RELEASE_DIGEST=FAIL >&2; exit 1; }
            sleep 10
          done
          identity="${REGISTRY}@${digest}"
          docker pull "$identity" >/dev/null
          bash scripts/verify_release_identity.sh "$identity" "$SOURCE_SHA"
          test "$(docker image inspect "$identity" --format '{{.Config.User}}')" = 10001:10001

          cosign verify \
            --certificate-identity-regexp '^https://github.com/appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml@.*$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$identity" >/dev/null
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp '^https://github.com/appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml@.*$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$identity" >/dev/null
          gh attestation verify "oci://${identity}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-repo appolon1908-hue/Codestra-Telemetry \
            --signer-workflow appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml \
            --signer-digest 9a6aebb849bbc068105c10d9d1dfd39ebf6f78bd \
            --source-ref refs/heads/production \
            --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners >/dev/null

          printf 'digest=%s\nidentity=%s\n' "$digest" "$identity" >> "$GITHUB_OUTPUT"
          echo SUPERSET_SIGNED_RELEASE_VERIFICATION=PASS

      - name: Write exact release tuple
        env:
          IMAGE_IDENTITY: ${{ steps.image.outputs.identity }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          payload = {
              "schema": "codestra.superset-signed-release.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["SOURCE_SHA"],
              "release_tag": os.environ["RELEASE_TAG"],
              "image": os.environ["IMAGE_IDENTITY"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "release_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "release_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "signature": "PASS",
              "spdx_attestation": "PASS",
              "github_build_provenance": "PASS",
              "production_activation": False,
          }
          Path("superset-signed-release.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum superset-signed-release.json > superset-signed-release.SHA256SUMS

      - id: evidence
        name: Bind exact release evidence
        run: |
          set -Eeuo pipefail
          sha256sum --check superset-signed-release.SHA256SUMS
          sha256="$(sha256sum superset-signed-release.json | awk '{print $1}')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub release record
        env:
          IMAGE_IDENTITY: ${{ steps.image.outputs.identity }}
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists and may not be reassigned" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$SOURCE_SHA" \
            --title "Superset ${RELEASE_TAG}" \
            --notes "Signed immutable image: ${IMAGE_IDENTITY}\n\nRuntime activation is not authorized by this release. Bounded staging, rollback, and production read-only certification remain separate fail-closed gates."

      - name: Upload signed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superset-signed-release-${{ needs.prepare.outputs.source_sha }}
          path: |
            superset-signed-release.json
            superset-signed-release.SHA256SUMS
          if-no-files-found: error
          retention-days: 365

  runtime-certification:
    needs: [prepare, release, verify-release]
    permissions:
      contents: read
      packages: read
      actions: read
      attestations: read
    uses: ./.github/workflows/bounded-runtime-certification.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      image: ${{ needs.verify-release.outputs.image }}
      image_digest: ${{ needs.verify-release.outputs.image_digest }}
      release_evidence_sha256: ${{ needs.verify-release.outputs.release_evidence_sha256 }}
      release_run_id: ${{ github.run_id }}
    secrets: inherit
