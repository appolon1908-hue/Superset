name: Validate Codestra Superset runtime v1

on:
  pull_request:
    paths:
      - "codestra/runtime-v1/**"
      - ".github/workflows/validate-codestra-runtime-v1.yml"
  push:
    branches:
      - development
      - test
      - staging
      - production
      - main
    paths:
      - "codestra/runtime-v1/**"
      - ".github/workflows/validate-codestra-runtime-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Compile Codestra Python configuration
        run: python -m py_compile codestra/runtime-v1/*.py
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate identity, analytics, and runtime contracts
        shell: python
        run: |
          from pathlib import Path
          import json
          import yaml

          root = Path("codestra/runtime-v1")
          config = (root / "superset_config.py.example").read_text()
          security = (root / "codestra_security_manager.py").read_text()
          governance = json.loads((root / "analytics-governance.json").read_text())
          compose_text = (root / "compose.candidate.yaml").read_text()
          compose = yaml.safe_load(compose_text)

          required_businesses = {
              "codestra", "moneybee", "beyvra", "breero", "larim-a",
              "transportation", "booked4seasons", "social", "klyrow",
              "telnexa", "kyqra", "restaurant", "provisioning",
          }
          assert set(governance["businesses"]) == required_businesses
          assert governance["rowLevelSecurity"]["defaultDeny"] is True
          assert governance["rowLevelSecurity"]["databaseNativeRlsAlsoRequired"] is True
          assert governance["releaseGates"]["rlsTestEvidenceRequired"] is True
          assert governance["releaseGates"]["writeCredentialsAllowed"] is False
          assert governance["releaseGates"]["directProductionDatabaseAccessAllowed"] is False
          assert 'AUTH_TYPE = AUTH_OAUTH' in config
          assert 'code_challenge_method": "S256"' in config
          assert 'read_secret("SUPERSET_SECRET_KEY_FILE")' in config
          assert 'read_secret("SUPERSET_OIDC_CLIENT_SECRET_FILE")' in config
          assert '"ALERT_REPORTS": False' in config
          assert '"EMBEDDED_SUPERSET": False' in config
          assert 'Only the Codestra Keycloak provider is approved' in security
          assert 'email_verified' in security
          assert 'No approved Codestra Superset role was supplied' in security
          assert 'protocol/openid-connect/userinfo' in security
          for business in required_businesses:
              assert business in security
          for name, service in compose["services"].items():
              assert "ports" not in service, name
              assert service["read_only"] is True, name
              assert "ALL" in service["cap_drop"], name
          assert set(compose["services"]) == {"superset-web", "superset-worker", "superset-beat"}
          assert all(set(value) == {"file"} for value in compose["secrets"].values())
          assert "env_file" not in compose_text
          assert "latest" not in compose_text.lower()
          forbidden_literals = ("changeme", "supersecret", "admin_password", "client_secret = '")
          assert not any(value in (config + compose_text).lower() for value in forbidden_literals)
          print("Codestra Superset runtime validation PASS")
      - name: Validate Compose structure without resolving runtime credentials
        run: docker compose -f codestra/runtime-v1/compose.candidate.yaml config --no-interpolate >/dev/null
