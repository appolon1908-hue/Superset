name: Validate Codestra production server API contract

on:
  pull_request:
    paths:
      - codestra/runtime-v1/check_metadata_readiness.py
      - codestra/runtime-v1/check_release_identity.py
      - codestra/runtime-v1/compose.production.yaml
      - codestra/runtime-v1/superset_config.py
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - scripts/validate_codestra_superset_readiness.py
      - .github/workflows/validate-production-server-api-contract.yml
  push:
    branches: [development, test, staging, production, main]
    paths:
      - codestra/runtime-v1/check_metadata_readiness.py
      - codestra/runtime-v1/check_release_identity.py
      - codestra/runtime-v1/compose.production.yaml
      - codestra/runtime-v1/superset_config.py
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - scripts/validate_codestra_superset_readiness.py
      - .github/workflows/validate-production-server-api-contract.yml

permissions:
  contents: read

concurrency:
  group: superset-production-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Compile and validate metadata readiness implementation
        run: |
          python -m py_compile \
            codestra/runtime-v1/check_metadata_readiness.py \
            scripts/validate_codestra_superset_readiness.py
          python scripts/validate_codestra_superset_readiness.py
      - name: Validate source-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md').read_text(encoding='utf-8')
          required = [
              'appolon1908-hue/Superset', '37.27.128.39',
              'SOURCE_CONTRACT_PREPARED_NOT_DEPLOYED', 'GET` | `/health',
              'web-process liveness only',
              'python /app/pythonpath/check_metadata_readiness.py',
              'GET` | `/api/v1/security/csrf_token/',
              'FAB_API_SWAGGER_UI = False',
              'METADATA_DATABASE_READINESS=PASS',
              'METADATA_DATABASE_SELECT_1=PASS',
              'GET_/swagger/v1_EXPECTED_DISABLED_404=PASS',
              'UNEXPECTED_REQUIRED_ROUTE_404=0',
              'PKCE S256', 'DATABASE_NATIVE_RLS=PASS', 'SUPERSET_RLS=PASS',
              'WRITE_ATTEMPT_DENIED=PASS', 'SOURCE_RUNTIME_DRIFT=0',
              'This document does not deploy Superset',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'missing production API contract controls: {missing}'
          forbidden = [
              'GET_/swagger/v1_ROUTE_EXISTS=PASS',
              '/health` | application and metadata health',
              'ADMIN_BYPASS_AUTHORIZED=YES',
              'SSH_CONFIGURATION_CHANGES_AUTHORIZED=YES',
              ':latest',
          ]
          present = [value for value in forbidden if value in text]
          assert not present, f'forbidden or misleading production contract claims: {present}'
          print('CODESTRA_SUPERSET_PRODUCTION_API_CONTRACT=PASS')
          PY
