name: Validate protected Superset source
on:
  push: {branches: [development, test, staging, production, main]}
permissions: {contents: read}
jobs:
  validate-protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.13"}
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements-validation.txt
          python3 scripts/validate_codestra_enterprise_profile.py
          python3 scripts/validate_codestra_superset.py
          python3 scripts/validate_codestra_superset_oidc.py
          python3 scripts/validate_codestra_superset_readiness.py
          python3 scripts/validate_codestra_review_hardening.py
          python3 scripts/validate_repository_readiness.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build_config_bundle.py --output /tmp/superset-config.tar.gz
