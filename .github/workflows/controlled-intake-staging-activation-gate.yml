name: Controlled intake staging evidence verification gate

on:
  pull_request:
    paths:
      - "integration/staging-activation-contract-v1.json"
      - ".github/workflows/controlled-intake-staging-activation-gate.yml"
  workflow_dispatch:
    inputs:
      execution_reason:
        description: "Why is this integration being executed?"
        required: true
        type: string
      change_id:
        description: "Approved staging certification identifier"
        required: true
        type: string
      expected_branch_head:
        description: "Exact 40-character Superset branch SHA being certified"
        required: true
        type: string
      middleware_image_digest:
        description: "Verified immutable Middleware digest"
        required: true
        type: string
      evidence_run_id:
        description: "Successful Codestra-Prometheus collector workflow run ID"
        required: true
        type: string
      evidence_artifact_name:
        description: "Exact attested evidence artifact name"
        required: true
        type: string
      evidence_archive_sha256:
        description: "SHA-256 of the downloaded GitHub artifact ZIP"
        required: true
        type: string
      evidence_manifest_sha256:
        description: "SHA-256 of the attested manifest.json"
        required: true
        type: string
      confirm_prometheus_only:
        description: "Only the approved Prometheus target may later become active"
        required: true
        type: boolean
      confirm_blackbox_pending:
        description: "Blackbox remains pending"
        required: true
        type: boolean
      confirm_no_external_effects:
        description: "No external effect or production mutation is authorized"
        required: true
        type: boolean

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: controlled-intake-staging-evidence-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-preparation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate fail-closed evidence contract
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(
              Path("integration/staging-activation-contract-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          assert data["schema_version"] == "1.2"
          assert data["suite_id"] == "codestra-controlled-intake-monitoring-v1"
          assert data["repository"] == "appolon1908-hue/Superset"
          assert data["component"] == "superset"
          assert data["execution_reason_required"] is True
          assert data["source_only_preparation"] is True

          source = data["middleware_source_authority"]
          assert source["repository"] == "appolon1908-hue/Middleware-"
          assert re.fullmatch(r"[0-9a-f]{40}", source["source_sha"])
          for key in (
              "immutable_image_digest",
              "signed_release_artifact_sha256",
              "sbom_sha256",
              "vulnerability_report_sha256",
          ):
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", source[key]), key

          evidence = data["staging_evidence"]
          assert evidence["collector_repository"] == (
              "appolon1908-hue/Codestra-Prometheus"
          )
          assert evidence["collector_branch"] == "development"
          assert evidence["collector_workflow_path"] == (
              ".github/workflows/controlled-intake-staging-activation-gate.yml"
          )
          assert evidence["artifact_name_prefix"] == (
              "controlled-intake-staging-evidence-"
          )
          assert evidence["manifest_path"] == "manifest.json"
          assert evidence["manifest_schema_version"] == "1.0"
          assert evidence["manifest_attestation_required"] is True
          assert evidence["archive_checksum_required"] is True
          assert evidence["manifest_checksum_required"] is True
          assert evidence["checksum"] is None
          assert evidence["state"] == "PENDING_ATTESTED_RUNTIME_EXECUTION"
          required_results = {
              "exact_middleware_source_sha",
              "immutable_image_digest",
              "signed_release_manifest",
              "sigstore_identity",
              "private_network_only",
              "metrics_read_scope",
              "health_read_scope",
              "unauthorized_request_denied",
              "wrong_token_denied",
              "complete_metric_catalogue",
              "bounded_cardinality",
              "no_pii_or_secret_exposure",
              "all_external_effects_disabled",
              "staging_soak",
              "rollback_proof",
          }
          assert set(evidence["must_verify"]) == required_results

          policy = data["activation_policy"]
          assert policy["only_prometheus_target_may_transition"] is True
          assert policy["prometheus_activation_pr_required"] is True
          assert policy["blackbox_must_remain_pending"] is True
          assert policy["production_activation_authorized"] is False
          assert data["runtime_effects"]
          assert all(value is False for value in data["runtime_effects"].values())
          print("CONTROLLED_STAGING_ATTESTED_EVIDENCE_CONTRACT=PASS")
          PY

  verify-attested-runtime-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-preparation-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXECUTION_REASON: ${{ inputs.execution_reason }}
      CHANGE_ID: ${{ inputs.change_id }}
      EXPECTED_BRANCH_HEAD: ${{ inputs.expected_branch_head }}
      MIDDLEWARE_IMAGE_DIGEST: ${{ inputs.middleware_image_digest }}
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
      EVIDENCE_ARCHIVE_SHA256: ${{ inputs.evidence_archive_sha256 }}
      EVIDENCE_MANIFEST_SHA256: ${{ inputs.evidence_manifest_sha256 }}
      CONFIRM_PROMETHEUS_ONLY: ${{ inputs.confirm_prometheus_only }}
      CONFIRM_BLACKBOX_PENDING: ${{ inputs.confirm_blackbox_pending }}
      CONFIRM_NO_EXTERNAL_EFFECTS: ${{ inputs.confirm_no_external_effects }}
      EVIDENCE_READER_TOKEN: ${{ secrets.CODESTRA_EVIDENCE_READER_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate exact-head request
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          reason = " ".join(os.environ["EXECUTION_REASON"].split())
          if len(reason) < 40:
              raise SystemExit(
                  "execution_reason must explain the operational need"
              )
          change_id = os.environ["CHANGE_ID"].strip().upper()
          if not re.fullmatch(r"CHG-[A-Z0-9][A-Z0-9._-]{7,}", change_id):
              raise SystemExit("change_id must use CHG-* format")

          expected_head = os.environ["EXPECTED_BRANCH_HEAD"].strip().lower()
          actual_head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if (
              not re.fullmatch(r"[0-9a-f]{40}", expected_head)
              or actual_head != expected_head
          ):
              raise SystemExit("exact-head validation failed")

          contract = json.loads(
              Path("integration/staging-activation-contract-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          source = contract["middleware_source_authority"]
          image = os.environ["MIDDLEWARE_IMAGE_DIGEST"].strip().lower()
          if image != source["immutable_image_digest"]:
              raise SystemExit(
                  "image digest must exactly match the source contract"
              )

          run_id = os.environ["EVIDENCE_RUN_ID"].strip()
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("evidence_run_id must be a positive integer")
          expected_name = (
              contract["staging_evidence"]["artifact_name_prefix"] + run_id
          )
          if os.environ["EVIDENCE_ARTIFACT_NAME"].strip() != expected_name:
              raise SystemExit(
                  "evidence artifact name must be bound to the run ID"
              )

          digest_pattern = r"sha256:[0-9a-f]{64}"
          for name in (
              "EVIDENCE_ARCHIVE_SHA256",
              "EVIDENCE_MANIFEST_SHA256",
          ):
              if not re.fullmatch(
                  digest_pattern, os.environ[name].strip().lower()
              ):
                  raise SystemExit(f"{name.lower()} is not a SHA-256 digest")

          for name in (
              "CONFIRM_PROMETHEUS_ONLY",
              "CONFIRM_BLACKBOX_PENDING",
              "CONFIRM_NO_EXTERNAL_EFFECTS",
          ):
              if os.environ[name].lower() != "true":
                  raise SystemExit(f"{name.lower()} confirmation is required")
          print("CONTROLLED_STAGING_EXACT_HEAD_REQUEST=PASS")
          PY

      - name: Fetch the exact successful collector artifact
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.CODESTRA_EVIDENCE_READER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EVIDENCE_READER_TOKEN:-}" || {
            echo "CODESTRA_EVIDENCE_READER_TOKEN is required" >&2
            exit 1
          }
          collector_repository="$(
            python3 -c 'import json; print(json.load(open("integration/staging-activation-contract-v1.json"))["staging_evidence"]["collector_repository"])'
          )"
          gh api \
            "repos/${collector_repository}/actions/runs/${EVIDENCE_RUN_ID}" \
            > /tmp/evidence-run.json
          gh api \
            "repos/${collector_repository}/actions/runs/${EVIDENCE_RUN_ID}/artifacts?per_page=100" \
            > /tmp/evidence-artifacts.json
          python3 - <<'PY'
          import json
          import os

          run = json.load(open("/tmp/evidence-run.json", encoding="utf-8"))
          artifacts = json.load(
              open("/tmp/evidence-artifacts.json", encoding="utf-8")
          )["artifacts"]
          contract = json.load(
              open(
                  "integration/staging-activation-contract-v1.json",
                  encoding="utf-8",
              )
          )
          evidence = contract["staging_evidence"]

          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("collector workflow run is not successful")
          if run.get("head_branch") != evidence["collector_branch"]:
              raise SystemExit("collector workflow branch mismatch")
          if run.get("path") != evidence["collector_workflow_path"]:
              raise SystemExit("collector workflow path mismatch")
          if run.get("event") != "workflow_dispatch":
              raise SystemExit("collector evidence must come from workflow_dispatch")

          matches = [
              artifact
              for artifact in artifacts
              if artifact.get("name")
              == os.environ["EVIDENCE_ARTIFACT_NAME"].strip()
              and artifact.get("expired") is False
          ]
          if len(matches) != 1:
              raise SystemExit(
                  "exactly one unexpired evidence artifact is required"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_id={matches[0]['id']}\n")
              output.write(
                  f"collector_repository={evidence['collector_repository']}\n"
              )
          PY

      - name: Download the located collector artifact
        env:
          GH_TOKEN: ${{ secrets.CODESTRA_EVIDENCE_READER_TOKEN }}
          COLLECTOR_REPOSITORY: ${{ steps.evidence.outputs.collector_repository }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ID:-}"
          gh api \
            "repos/${COLLECTOR_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/evidence.zip
          test -s /tmp/evidence.zip

      - name: Verify archive, attestation, manifest, and required results
        env:
          GH_TOKEN: ${{ secrets.CODESTRA_EVIDENCE_READER_TOKEN }}
          COLLECTOR_REPOSITORY: ${{ steps.evidence.outputs.collector_repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("/tmp/evidence.zip")
          actual = "sha256:" + hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != os.environ["EVIDENCE_ARCHIVE_SHA256"].strip().lower():
              raise SystemExit("evidence archive checksum mismatch")

          destination = Path("/tmp/evidence")
          destination.mkdir(mode=0o700)
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  path = PurePosixPath(item.filename)
                  file_type = (item.external_attr >> 16) & 0o170000
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or file_type == 0o120000
                  ):
                      raise SystemExit("unsafe evidence archive member")
              bundle.extractall(destination)
          PY
          manifest="/tmp/evidence/manifest.json"
          test -f "$manifest"
          gh attestation verify "$manifest" \
            --repo "$COLLECTOR_REPOSITORY" \
            > /tmp/evidence-attestation.txt
          test -s /tmp/evidence-attestation.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path("/tmp/evidence/manifest.json")
          actual_manifest = (
              "sha256:" + hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          )
          if (
              actual_manifest
              != os.environ["EVIDENCE_MANIFEST_SHA256"].strip().lower()
          ):
              raise SystemExit("evidence manifest checksum mismatch")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          contract = json.loads(
              Path("integration/staging-activation-contract-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          evidence = contract["staging_evidence"]
          source = contract["middleware_source_authority"]

          if manifest.get("schema_version") != evidence["manifest_schema_version"]:
              raise SystemExit("evidence manifest schema mismatch")
          collector = manifest.get("collector", {})
          expected_collector = {
              "repository": evidence["collector_repository"],
              "workflow_path": evidence["collector_workflow_path"],
              "run_id": int(os.environ["EVIDENCE_RUN_ID"]),
          }
          for key, expected in expected_collector.items():
              if collector.get(key) != expected:
                  raise SystemExit(f"collector evidence mismatch: {key}")

          subject = manifest.get("subject", {})
          if subject.get("repository") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("evidence subject repository mismatch")
          if (
              subject.get("source_sha")
              != os.environ["EXPECTED_BRANCH_HEAD"].strip().lower()
          ):
              raise SystemExit("evidence subject SHA mismatch")

          middleware = manifest.get("middleware", {})
          if middleware.get("source_sha") != source["source_sha"]:
              raise SystemExit("middleware source evidence mismatch")
          if (
              middleware.get("image_digest")
              != source["immutable_image_digest"]
          ):
              raise SystemExit("middleware image evidence mismatch")

          results = manifest.get("results")
          if not isinstance(results, dict):
              raise SystemExit("evidence results are missing")
          failed = [
              name
              for name in evidence["must_verify"]
              if results.get(name) != "PASS"
          ]
          if failed:
              raise SystemExit(
                  "required evidence did not pass: " + ", ".join(failed)
              )

          effects = manifest.get("external_effects")
          if not isinstance(effects, dict) or not effects:
              raise SystemExit("external-effects evidence is missing")
          enabled = sorted(
              name for name, value in effects.items() if value is not False
          )
          if enabled:
              raise SystemExit(
                  "external effects are not disabled: " + ", ".join(enabled)
              )
          print("CONTROLLED_STAGING_ATTESTED_RUNTIME_EVIDENCE=PASS")
          PY

      - name: Record non-activating verification summary
        run: |
          {
            echo "## Controlled staging evidence verified"
            echo "- Why executed: ${EXECUTION_REASON}"
            echo "- Change ID: \`${CHANGE_ID}\`"
            echo "- Superset exact head: \`${EXPECTED_BRANCH_HEAD}\`"
            echo "- Collector run: \`${EVIDENCE_RUN_ID}\`"
            echo "- Evidence artifact: \`${EVIDENCE_ARTIFACT_NAME}\`"
            echo "- Middleware image: \`${MIDDLEWARE_IMAGE_DIGEST}\`"
            echo "- Prometheus activation: **separate PR required**"
            echo "- Blackbox: **pending**"
            echo "- Deployment performed by this workflow: **No**"
          } >> "$GITHUB_STEP_SUMMARY"
