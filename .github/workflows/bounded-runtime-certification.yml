name: Superset bounded runtime certification

on:
  workflow_run:
    workflows:
      - Release signed Superset image
    types:
      - completed

permissions:
  contents: read
  packages: read
  actions: read
  attestations: read

concurrency:
  group: superset-bounded-runtime-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release-policy:
    name: release-policy
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      image: ${{ steps.release.outputs.image }}
      image_digest: ${{ steps.release.outputs.image_digest }}
      release_evidence_sha256: ${{ steps.release.outputs.release_evidence_sha256 }}
      release_run_id: ${{ steps.release.outputs.release_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      REGISTRY: ghcr.io/appolon1908-hue/superset-superset
    steps:
      - name: Check out the exact protected production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove production and triggering workflow authority
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_RUN_NUMBER" =~ ^[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin production
          test "$(git rev-parse origin/production)" = "$SOURCE_SHA"
          test "${{ github.event.workflow_run.path }}" = .github/workflows/release-image.yml
          echo SUPERSET_BOUNDED_RELEASE_POLICY=PASS

      - name: Download the triggering release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: superset-signed-release-${{ github.event.workflow_run.head_sha }}
          path: release-evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: release
        name: Verify the immutable release tuple
        run: |
          set -Eeuo pipefail
          cd release-evidence
          sha256sum --check superset-signed-release.SHA256SUMS
          release_evidence_sha256="$(sha256sum superset-signed-release.json | awk '{print $1}')"
          [[ "$release_evidence_sha256" =~ ^[0-9a-f]{64}$ ]]

          release_tag="codestra-superset-v2026.9.${RELEASE_RUN_NUMBER}"
          image="$(jq -er '.image' superset-signed-release.json)"
          image_digest="$(jq -er '.image_digest' superset-signed-release.json)"
          test "$(jq -er '.schema' superset-signed-release.json)" = codestra.superset-signed-release.v1
          test "$(jq -er '.repository' superset-signed-release.json)" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.source_sha' superset-signed-release.json)" = "$SOURCE_SHA"
          test "$(jq -er '.release_tag' superset-signed-release.json)" = "$release_tag"
          test "$(jq -er '.release_run_id' superset-signed-release.json)" = "$RELEASE_RUN_ID"
          test "$(jq -er '.signature' superset-signed-release.json)" = PASS
          test "$(jq -er '.spdx_attestation' superset-signed-release.json)" = PASS
          test "$(jq -er '.github_build_provenance' superset-signed-release.json)" = PASS
          test "$(jq -er '.production_activation' superset-signed-release.json)" = false
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$image" = "${REGISTRY}@${image_digest}"

          docker pull "$image" >/dev/null
          bash ../scripts/verify_release_identity.sh "$image" "$SOURCE_SHA"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 10001:10001
          cosign verify \
            --certificate-identity-regexp '^https://github.com/appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml@.*$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image" >/dev/null
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp '^https://github.com/appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml@.*$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image" >/dev/null
          gh attestation verify "oci://${image}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-repo appolon1908-hue/Codestra-Telemetry \
            --signer-workflow appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml \
            --signer-digest 9a6aebb849bbc068105c10d9d1dfd39ebf6f78bd \
            --source-ref refs/heads/production \
            --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners >/dev/null

          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'image=%s\n' "$image"
            printf 'image_digest=%s\n' "$image_digest"
            printf 'release_evidence_sha256=%s\n' "$release_evidence_sha256"
            printf 'release_run_id=%s\n' "$RELEASE_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          echo SUPERSET_SIGNED_RELEASE_TUPLE=PASS

  artifact-staging-certification:
    name: artifact-staging-certification
    needs: release-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      evidence_sha256: ${{ steps.evidence.outputs.sha256 }}
    env:
      SOURCE_SHA: ${{ needs.release-policy.outputs.source_sha }}
      IMAGE: ${{ needs.release-policy.outputs.image }}
      IMAGE_DIGEST: ${{ needs.release-policy.outputs.image_digest }}
    steps:
      - name: Check out the exact released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.release-policy.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Certify exact signed image and rehearse isolated rollback
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$IMAGE" = "ghcr.io/appolon1908-hue/superset-superset@${IMAGE_DIGEST}"
          bash scripts/run_disposable_integration.sh \
            "$SOURCE_SHA" \
            "$IMAGE" \
            artifact-staging-evidence.json \
            | tee artifact-staging-certification.txt
          grep -qx SUPERSET_BOUNDED_STAGING_ROLLBACK=PASS artifact-staging-certification.txt

      - id: evidence
        name: Bind hosted staging evidence
        run: |
          set -Eeuo pipefail
          test -s artifact-staging-evidence.json
          sha256="$(sha256sum artifact-staging-evidence.json | awk '{print $1}')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact staging certification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superset-artifact-staging-${{ needs.release-policy.outputs.source_sha }}
          path: |
            artifact-staging-evidence.json
            artifact-staging-certification.txt
          if-no-files-found: error
          retention-days: 365

  bounded-staging-runtime:
    name: bounded-staging-runtime
    needs: [release-policy, artifact-staging-certification]
    runs-on: [self-hosted, codestra-staging]
    environment: staging-readonly
    timeout-minutes: 120
    outputs:
      staging_evidence_sha256: ${{ steps.evidence.outputs.sha256 }}
    env:
      SOURCE_SHA: ${{ needs.release-policy.outputs.source_sha }}
      IMAGE: ${{ needs.release-policy.outputs.image }}
      IMAGE_DIGEST: ${{ needs.release-policy.outputs.image_digest }}
      ARTIFACT_EVIDENCE_SHA256: ${{ needs.artifact-staging-certification.outputs.evidence_sha256 }}
    steps:
      - name: Record canonical staging execution contract
        run: |
          set -Eeuo pipefail
          echo SUPERSET_STAGING_RUNNER_LABEL=codestra-staging
          echo SUPERSET_STAGING_ENVIRONMENT=staging-readonly
          [[ "$ARTIFACT_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out the exact released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.release-policy.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download hosted artifact-staging evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: superset-artifact-staging-${{ needs.release-policy.outputs.source_sha }}
          path: artifact-staging

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify hosted evidence and certify bounded staging
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum artifact-staging/artifact-staging-evidence.json | awk '{print $1}')" = \
            "$ARTIFACT_EVIDENCE_SHA256"
          bash scripts/run_disposable_integration.sh \
            "$SOURCE_SHA" \
            "$IMAGE" \
            bounded-staging-evidence.json \
            | tee bounded-staging-runtime.txt
          grep -qx SUPERSET_BOUNDED_STAGING_ROLLBACK=PASS bounded-staging-runtime.txt
          python3 - \
            artifact-staging/artifact-staging-evidence.json \
            bounded-staging-evidence.json \
            "$SOURCE_SHA" "$IMAGE" "$IMAGE_DIGEST" <<'PY'
          import json, sys

          hosted_path, bounded_path, source_sha, image, digest = sys.argv[1:]
          hosted = json.load(open(hosted_path, encoding="utf-8"))
          bounded = json.load(open(bounded_path, encoding="utf-8"))
          required = {
              "schema": "codestra.superset-bounded-staging-evidence.v1",
              "source_sha": source_sha,
              "image": image,
              "image_digest": digest,
              "release_mode": "signed-immutable",
              "migration": "PASS",
              "bootstrap_idempotency": "PASS",
              "metadata_readiness": "PASS",
              "backup_integrity": "PASS",
              "restore": "PASS",
              "runtime_rollback_restart": "PASS",
              "database_native_rls": "PASS",
              "cross_business_denial": "PASS",
              "write_attempt_denied": "PASS",
              "public_traffic_changed": False,
              "production_runtime_changed": False,
              "live_effects_enabled": False,
          }
          for evidence in (hosted, bounded):
              for key, expected in required.items():
                  if evidence.get(key) != expected:
                      raise SystemExit(f"staging evidence mismatch: {key}")
          PY

      - id: evidence
        name: Bind bounded staging evidence
        run: |
          set -Eeuo pipefail
          sha256="$(sha256sum bounded-staging-evidence.json | awk '{print $1}')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload bounded staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superset-bounded-staging-${{ needs.release-policy.outputs.source_sha }}
          path: |
            bounded-staging-evidence.json
            bounded-staging-runtime.txt
          if-no-files-found: error
          retention-days: 365

  production-readonly-canary:
    name: production-readonly-canary
    needs: [release-policy, bounded-staging-runtime]
    runs-on: [self-hosted, codestra-production-canary]
    environment: production-readonly-canary
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ needs.release-policy.outputs.source_sha }}
      IMAGE: ${{ needs.release-policy.outputs.image }}
      IMAGE_DIGEST: ${{ needs.release-policy.outputs.image_digest }}
      STAGING_EVIDENCE_SHA256: ${{ needs.bounded-staging-runtime.outputs.staging_evidence_sha256 }}
      SUPERSET_CANARY_CONTROLLER: ${{ vars.SUPERSET_CANARY_CONTROLLER }}
      SUPERSET_CANARY_CONTROLLER_SHA256: ${{ vars.SUPERSET_CANARY_CONTROLLER_SHA256 }}
      SUPERSET_PRODUCTION_BASE_URL: ${{ vars.SUPERSET_PRODUCTION_BASE_URL || 'https://supe.codestra.media' }}
      SUPERSET_CANARY_PERCENT: ${{ vars.SUPERSET_CANARY_PERCENT || '1' }}
      SUPERSET_READONLY_BEARER_TOKEN: ${{ secrets.SUPERSET_READONLY_BEARER_TOKEN }}
    steps:
      - name: Record canonical production canary contract
        run: |
          set -Eeuo pipefail
          echo SUPERSET_PRODUCTION_RUNNER_LABEL=codestra-production-canary
          echo SUPERSET_PRODUCTION_ENVIRONMENT=production-readonly-canary
          [[ "$STAGING_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out the same exact production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.release-policy.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact bounded staging evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: superset-bounded-staging-${{ needs.release-policy.outputs.source_sha }}
          path: bounded-staging

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reverify exact image and staging evidence
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin production
          test "$(git rev-parse origin/production)" = "$SOURCE_SHA"
          test "$IMAGE" = "ghcr.io/appolon1908-hue/superset-superset@${IMAGE_DIGEST}"
          test "$(sha256sum bounded-staging/bounded-staging-evidence.json | awk '{print $1}')" = \
            "$STAGING_EVIDENCE_SHA256"
          docker pull "$IMAGE" >/dev/null
          bash scripts/verify_release_identity.sh "$IMAGE" "$SOURCE_SHA"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/appolon1908-hue/Codestra-Telemetry/.github/workflows/reusable-release-image.yml@.*$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE" >/dev/null

      - name: Run maximum one-percent GET/HEAD-only canary and roll it back
        run: |
          set -o pipefail
          bash scripts/run_production_readonly_canary.sh \
            "$SOURCE_SHA" \
            "$IMAGE" \
            "$IMAGE_DIGEST" \
            bounded-staging/bounded-staging-evidence.json \
            production-readonly-canary-evidence.json \
            | tee production-readonly-canary.txt
          grep -qx SUPERSET_PRODUCTION_READONLY_CANARY=PASS production-readonly-canary.txt

      - name: Upload production read-only evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superset-production-readonly-canary-${{ needs.release-policy.outputs.source_sha }}
          path: |
            production-readonly-canary-evidence.json
            production-readonly-canary.txt
          if-no-files-found: error
          retention-days: 365

  certification-result:
    name: certification-result
    needs: [release-policy, artifact-staging-certification, bounded-staging-runtime, production-readonly-canary]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve fail-closed aggregate result
        env:
          RELEASE_POLICY: ${{ needs.release-policy.result }}
          ARTIFACT_STAGING: ${{ needs.artifact-staging-certification.result }}
          BOUNDED_STAGING: ${{ needs.bounded-staging-runtime.result }}
          PRODUCTION_CANARY: ${{ needs.production-readonly-canary.result }}
        run: |
          set -Eeuo pipefail
          printf 'RELEASE_POLICY=%s\nARTIFACT_STAGING=%s\nBOUNDED_STAGING=%s\nPRODUCTION_CANARY=%s\n' \
            "$RELEASE_POLICY" "$ARTIFACT_STAGING" "$BOUNDED_STAGING" "$PRODUCTION_CANARY"
          test "$RELEASE_POLICY" = success
          test "$ARTIFACT_STAGING" = success
          test "$BOUNDED_STAGING" = success
          test "$PRODUCTION_CANARY" = success
          echo SUPERSET_FULL_READONLY_CERTIFICATION=PASS
